# actionlint configuration (https://github.com/rhysd/actionlint).
#
# `release.yml` is autogenerated by `dist generate --mode ci` and re-checked
# for up-to-dateness on every PR (a hand edit fails dist's own check), so
# shellcheck findings inside dist's generated scripts are ignored here
# instead of "fixed":
#   SC2086 — word-splitting infos in dist's upload/host scripts
#   SC2129 — style hint about consecutive redirects in the plan step
# `release-smoke.yml` and `ci.yml` stay linted strictly.
paths:
  ".github/workflows/release.yml":
    ignore:
      - SC2086
      - SC2129
