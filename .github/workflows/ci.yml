name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run of the Category B reference job (it gates on `schedule`/dispatch).
  schedule:
    - cron: '0 4 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain-cache
      - run: cargo fmt --all --check

  lint:
    # Workflow self-check: catches ci.yml mistakes here instead of at run time
    # (the local mirror is `cargo xtask ci lint`, skips without actionlint).
    # Pinned actionlint + checksum: the release asset is linux_amd64, not x86_64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned actionlint
        run: |
          set -o pipefail
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz' | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - run: actionlint

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain-cache
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    # Category A only (agents/plan/TESTING.md): pure Rust, no network/Java, 3-OS matrix.
    needs: clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain-cache
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  bench:
    # Informational (agents/plan/TESTING.md §Benchmarks): posts numbers, flags >~10% regressions for
    # human review; no auto-fail. Baselines committed under bench-baseline/.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain-cache
      - uses: Swatinem/rust-cache@v2
      # No `-- --report-dir`: trailing args go to EVERY bench harness, and the
      # libtest-generated `--lib` bench binaries abort on unknown options.
      # Criterion's default report root is target/criterion (what we upload).
      - run: cargo bench --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion

  coverage:
    # Report only — no percentage gate.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain-cache
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --summary-only
        continue-on-error: true
      # Runner toolchain comes from rust-toolchain.toml (llvm-tools-preview included).

  reference:
    # Category B (agents/plan/TESTING.md): the reference binary is slow, so this runs
    # weekly / on demand only — never per PR. With the feature enabled a skipped
    # Category B test must FAIL: OXIDZR_REFERENCE_STRICT=1 enforces it.
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain-cache
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache pinned structurizr war
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/structurizr.war
          key: structurizr-war-2026.10.26
      - name: Install pinned structurizr (unified application binary)
        run: |
          [ -f "$RUNNER_TEMP/structurizr.war" ] || \
            curl -fsSL -o "$RUNNER_TEMP/structurizr.war" \
              https://download.structurizr.com/structurizr-2026.10.26.war
          # Quoted heredoc: $RUNNER_TEMP/"$@" stay literal, expand when the wrapper runs.
          cat > /usr/local/bin/structurizr <<'EOF'
          #!/bin/sh
          exec java -jar "$RUNNER_TEMP/structurizr.war" "$@"
          EOF
          chmod +x /usr/local/bin/structurizr
      - run: cargo test --workspace --features reference
        env:
          OXIDZR_REFERENCE_STRICT: '1'
      - run: cargo xtask oracle verify
        env:
          OXIDZR_REFERENCE_STRICT: '1'
