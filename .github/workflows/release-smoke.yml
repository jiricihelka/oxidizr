# Per-OS smoke over the published GitHub Release assets.
#
# Deliberately a companion workflow, NOT baked into `release.yml`: that file
# is autogenerated by `dist generate --mode ci` and re-validated on every PR
# (dist's own up-to-dateness check would reject hand-written steps), and
# cargo-dist has no custom-job hook to inject one (its GitHub CI layer knows
# only runners/permissions/build-setup/action-commits).
#
# Scope per the release plan row: each release binary's `--version` and a
# `dsl2json` conversion of one committed Category A fixture.
# `x86_64-apple-darwin` is built but not smoked — the GitHub-hosted fleet has
# no x86_64 macOS runners.
name: Release smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to smoke (e.g. v0.4.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: smoke ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - triple: aarch64-apple-darwin
            runner: macos-14
          - triple: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release assets (${{ matrix.triple }})
        # Patterns pull all three archives plus their .sha256 siblings. The
        # GUI binary is checksum- and archive-verified only — it cannot be
        # run headless; its verification stays the CI build leg.
        run: gh release download "$TAG" -p "oxidizr-cli-${{ matrix.triple }}*" -p "oxidizr-lsp-${{ matrix.triple }}*" -p "oxidizr-viewer-${{ matrix.triple }}*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify checksums
        shell: bash
        run: |
          hash() { sha256sum "$1" 2>/dev/null || shasum -a 256 "$1"; }
          for f in *.sha256; do
            [ -e "$f" ] || continue
            target="${f%.sha256}"
            expected="$(awk '{print $1}' "$f")"
            actual="$(hash "$target" | awk '{print $1}')"
            if [ "$expected" != "$actual" ]; then echo "checksum mismatch for $target"; exit 1; fi
            echo "ok $target"
          done

      - name: Extract
        shell: bash
        run: |
          mkdir -p extract
          for a in oxidizr-cli-* oxidizr-lsp-* oxidizr-viewer-*; do
            case "$a" in
              *.tar.xz) tar -xf "$a" -C extract ;;
              *.zip) unzip -q "$a" -d extract || tar -xf "$a" -C extract ;;
              *) continue ;;
            esac
          done

      - name: Smoke --version + dsl2json (Category A fixture)
        # bash exists on every hosted runner image (git bash on Windows).
        # The GUI binary is deliberately NOT executed here — headless runners
        # cannot verify it; its CI build leg is the verification.
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          bin() {
            f="$(find extract -type f -name "$1$ext" -print -quit)"
            [ -n "$f" ] || { echo "missing $1$ext in release assets"; exit 1; }
            echo "$f"
          }
          oxidizr="$(bin oxidizr)"
          lsp="$(bin oxidizr-lsp)"
          expected="${TAG#v}"
          "$oxidizr" --version
          "$oxidizr" --version | grep -F "$expected"
          "$lsp" --version | grep -F "$expected"
          "$oxidizr" dsl2json testdata/dsl/color-schemes.dsl -o smoke.json
          test -s smoke.json
          node -e 'JSON.parse(require("fs").readFileSync("smoke.json"))'
