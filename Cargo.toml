[workspace]
resolver = "3" # edition-2024 members; virtual workspaces need it explicit
members = [
    "crates/oxidizr-core",
    "crates/oxidizr-ast",
    "crates/oxidizr-diag",
    "crates/oxidizr-dsl",
    "crates/oxidizr-json",
    "crates/oxidizr-export",
    "crates/oxidizr-layout",
    "crates/oxidizr-api",
    "crates/oxidizr-cli",
    "crates/oxidizr-e2e",
    "crates/xtask",
]
# cargo-fuzz workspace (nightly + sanitizers) — driven by `cargo xtask fuzz`;
# NOT a member so fmt/clippy/test --workspace never touch the fuzz targets.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jiricihelka/oxidizr"

[workspace.dependencies]
oxidizr-core = { path = "crates/oxidizr-core", version = "0.1.0" }
oxidizr-ast = { path = "crates/oxidizr-ast", version = "0.1.0" }
oxidizr-diag = { path = "crates/oxidizr-diag", version = "0.1.0" }
oxidizr-dsl = { path = "crates/oxidizr-dsl", version = "0.1.0" }
oxidizr-json = { path = "crates/oxidizr-json", version = "0.1.0" }
oxidizr-export = { path = "crates/oxidizr-export", version = "0.1.0" }
oxidizr-api = { path = "crates/oxidizr-api", version = "0.1.0" }
oxidizr-e2e = { path = "crates/oxidizr-e2e", version = "0.1.0" }

# `preserve_order`: property maps must iterate in DOCUMENT order on read
# (byte-stable round-trip, WRITE-CATALOG §1) — the default BTreeMap sorts.
# (No plain `serde`: the P1-D5 amendment dropped the derive route — the JSON
# layer is hand-rolled over `serde_json`.)
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

expect-test = "1"
criterion = "0.5"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

# Skeleton crates pre-declare the agreed P1-D9 dependency set before the code
# that uses it lands (M3+); the cargo manifest lints (warn-by-default, see the
# Cargo Book "Lints" chapter — both names fire: `unused_dependencies` on the
# crate tables, `unused_workspace_dependencies` on workspace tables) would
# otherwise fire on every crate until each dependency's code lands.
[workspace.lints.cargo]
unused_dependencies = "allow"
unused_workspace_dependencies = "allow"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
# 2R PR6 ratchet (PHASE_2R.md §D4, V-R2 decision table): the last-use
# `x.clone()` family stable clippy does not cover. Nursery = unstable, so
# this line is nightly-only (rust-toolchain.toml pin; NIGHTLY.md register
# row). Measured: 11/11 genuine sites (all fixed in that commit), ≈ +4 %
# cold-clippy cost, ranges overlapping. CI `-D warnings` makes it binding.
redundant_clone = "warn"
