[workspace]
resolver = "3" # edition-2024 members; virtual workspaces need it explicit
members = [
    "crates/oxidizr-core",
    "crates/oxidizr-ast",
    "crates/oxidizr-diag",
    "crates/oxidizr-dsl",
    "crates/oxidizr-json",
    "crates/oxidizr-cli",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jiricihelka/oxidizr"

[workspace.dependencies]
oxidizr-core = { path = "crates/oxidizr-core", version = "0.1.0" }
oxidizr-ast = { path = "crates/oxidizr-ast", version = "0.1.0" }
oxidizr-diag = { path = "crates/oxidizr-diag", version = "0.1.0" }
oxidizr-dsl = { path = "crates/oxidizr-dsl", version = "0.1.0" }
oxidizr-json = { path = "crates/oxidizr-json", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

expect-test = "1"
criterion = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
