[package]
name = "oxidizr-api"
description = "oxidizr headless pipeline: Request -> execute() -> Outcome (P1T-D1, F9) — the stable in-process surface behind the CLI"
publish = false
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
oxidizr-core = { workspace = true }
oxidizr-diag = { workspace = true }
oxidizr-dsl = { workspace = true }
oxidizr-json = { workspace = true }
oxidizr-export = { workspace = true }
# §P4-M1 inspect: the advisory engine; the pipeline loads the workspace
# via `open` and reports the violations (the JSON contract is untouched).
oxidizr-inspect = { workspace = true }
oxidizr-import = { workspace = true }
# §P4-M0 diff: the `before`/`after` values of a field-level change are
# `serde_json::Value` (the schema-1 document D-2 renders them verbatim).
serde_json = { workspace = true }

[dev-dependencies]
# §P4-M0 D-2: the schema-1 serialization snapshot (`expect!`).
expect-test = { workspace = true }
