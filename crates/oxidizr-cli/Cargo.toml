[package]
name = "oxidizr-cli"
description = "oxidizr CLI: dsl2json, json2json, validate, fmt, reconcile, view (gui feature)"
publish = false
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
reference = []
# F10 (§P3-M8): the GUI entry `oxidizr view` — OPTIONAL so the default
# build keeps a ZERO eframe/GPU dependency tree (P3-D1 amended); with
# the feature off the subcommand stays in `--help` but exits with a
# rebuild hint.
gui = ["dep:oxidizr-viewer", "oxidizr-viewer/gui"]

[dependencies]
oxidizr-api = { workspace = true }
oxidizr-core = { workspace = true }
oxidizr-diag = { workspace = true }
oxidizr-dsl = { workspace = true }
oxidizr-json = { workspace = true }
oxidizr-viewer = { workspace = true, optional = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
miette = { workspace = true }

[[bin]]
name = "oxidizr"
path = "src/main.rs"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "reconcile"
harness = false
