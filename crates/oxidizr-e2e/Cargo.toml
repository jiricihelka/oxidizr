[package]
name = "oxidizr-e2e"
description = "oxidizr e2e regression suite: in-process manifest checks over e2e/corpus (Phase 1T); Category A, dev-only"
publish = false
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
oxidizr-api = { workspace = true }
oxidizr-core = { workspace = true }
oxidizr-json = { workspace = true }
serde_json = { workspace = true }

[features]
# Heavy whole-corpus benches (P1T-D7): local dev only. CI's
# `cargo bench --workspace` skips the target (required-features);
# `cargo xtask bench` opts in explicitly.
e2e-bench = []

[[bench]]
name = "e2e"
harness = false
required-features = ["e2e-bench"]

[dev-dependencies]
# Binary for the subprocess smoke test (CARGO_BIN_EXE_oxidizr).
oxidizr-cli = { path = "../oxidizr-cli" }
# Codes registry for the coverage gate's catalog sync check (P4T gap 2).
oxidizr-diag = { workspace = true }
criterion = { workspace = true }
