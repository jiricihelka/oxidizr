[package]
name = "oxidizr-viewer"
description = "oxidizr-viewer: native workspace viewer + layout editor (P3) — headless lib core + thin eframe shell"
publish = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# The eframe shell is the ONLY windowing/GPU surface (P3-D1, risk R-2).
# Gated so `cargo test --workspace` and the quartet build and run the lib
# core with ZERO GPU/windowing need; `cargo build --features gui` (CI
# M0-4 leg, and end-user builds) compiles the binary. `clap` rides the
# shell (argv parsing) so the headless dep graph stays lean.
#
# `dagre` is a DEFAULT feature: the dagre engine is this app's default
# layout engine (pure computation — it adds no windowing or IO surface, and
# the serde pair it drags in is already a viewer dependency). `Layered`
# stays the built-in fallback and the engine of pinned runs; builds that
# drop the default (`--no-default-features`) lose the combo entry and the
# default reverts to `Layered`. The `oxidizr-layout` crate keeps its own
# `dagre` feature NON-default, so the zero-dep library promise stands.
default = ["dagre"]
gui = ["dep:eframe", "dep:clap", "dep:egui_commonmark"]
# M4-6: the optional graphviz `dot` layout backend — pure passthrough to
# `oxidizr-layout/dot-backend` (which is itself OFF by default). The
# dialog's engine combo lists `Dot` only when this is compiled in AND
# `$OXIDZR_DOT_BIN` names a binary; the shipped default build has zero
# subprocess surface.
dot-backend = ["oxidizr-layout/dot-backend"]
# P7: the `dagre` layout engine — pure passthrough to
# `oxidizr-layout/dagre` (itself OFF by default). The dialog's engine
# combo lists `Dagre` whenever this is compiled in: the engine is pure
# computation, so unlike graphviz it needs no binary in the environment.
dagre = ["oxidizr-layout/dagre"]

[[bin]]
name = "oxidizr-viewer"
required-features = ["gui"]

[dependencies]
oxidizr-core = { workspace = true }
oxidizr-api = { workspace = true }
oxidizr-diag = { workspace = true }
oxidizr-json = { workspace = true }
oxidizr-layout = { workspace = true }
thiserror = { workspace = true }
# §P3-M11 M11-12 (F11): the `<stem>.oxidizr.json` sidecar is OUR OWN
# JSON — serde_json over an envelope that NEVER enters the contract
# reader/writer (oxidizr_json stays untouched). Pure-Rust, no platform
# API (the std-only rule is about portability, not crates).
serde_json = { workspace = true }
# Software raster + text layout for the headless `paint` module (M1-4):
# pure CPU code, no windowing/GPU — the `gui` gate keeps guarding ONLY
# the eframe shell. Shapes/text come out as `epaint::Shape` data the
# shell draws verbatim.
epaint = { workspace = true }
# Headless members of the P3 stack (P3-D7): notify powers `reload`, the
# raster trio (`usvg` parse → `resvg` render → `tiny-skia` pixmap) plus
# `png`/`base64` rasterize style icons without any GUI (M1-5 `icons`).
# Pre-declared per the P1-D9 pattern (unused-dep cargo lints are allowed
# at the workspace).
notify = { workspace = true }
usvg = { workspace = true }
resvg = { workspace = true }
tiny-skia = { workspace = true }
png = { workspace = true }
base64 = { workspace = true }
ab_glyph = { workspace = true }
dark-light = { workspace = true }
clap = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }
egui_commonmark = { workspace = true, optional = true }

# Release packaging (dist-workspace.toml at the workspace root): the GUI
# binary ships in the GitHub release via this per-package feature override
# (the crate's default build stays zero-GPU; required-features on the bin
# would otherwise leave dist with nothing to package). The headless release
# smoke does not cover it — a GUI binary cannot be smoked headless, its
# verification stays the CI `--features gui` build leg.
[package.metadata.dist]
features = ["gui"]
